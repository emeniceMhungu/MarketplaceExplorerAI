name: Continuous Integration Security Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify-build-integrity:
    name: Type Check & Lint Auditing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project Source Code Repository
        uses: actions/checkout@v4

      - name: Initialize Enterprise Node.js Environment Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Map Lockfile Dependencies Safely
        run: npm ci

      - name: Enforce Strict Global TypeScript Type Checks
        run: npx tsc --noEmit

      - name: Enforce ESLint Policy Compliance
        run: npm run lint --if-present

  dependency-audit-gate:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project Source Code Repository
        uses: actions/checkout@v4

      - name: Initialize Enterprise Node.js Environment Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Map Lockfile Dependencies Safely
        run: npm ci

      - name: Run NPM Vulnerability Audit (High+ Severity)
        run: npm audit --audit-level=high

  dependency-review-gate:
    name: Pull Request Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Project Source Code Repository
        uses: actions/checkout@v4

      - name: Review Pull Request Dependency Changes
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@v4

      - name: Dependency Graph Disabled Warning
        if: steps.dependency_review.outcome == 'failure'
        run: |
          echo "Dependency review check was skipped because Dependency Graph is not enabled for this repository."
          echo "Enable it in Settings -> Security and analysis -> Dependency graph."

  android-apk-delivery:
    name: Android APK Delivery Build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs:
      - verify-build-integrity
      - dependency-audit-gate

    steps:
      - name: Checkout Project Source Code Repository
        uses: actions/checkout@v4

      - name: Initialize Enterprise Node.js Environment Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Initialize JDK Runtime for Android Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Map Lockfile Dependencies Safely
        run: npm ci

      - name: Generate Android Native Project via Expo Prebuild
        run: npx expo prebuild --platform android --non-interactive

      - name: Compile Installable Android APK via Gradle Assemble
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish Android APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketplaceexplorerai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
